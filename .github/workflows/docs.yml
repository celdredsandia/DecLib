name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Install Sphinx toolchain
        run: pip install -r docs/requirements.txt

      - name: Build docs (warnings are errors)
        run: |
          cmake -S . -B build -DDECLIB_BUILD_LIBRARY=OFF -DDECLIB_BUILD_DOCS=ON
          cmake --build build --target docs

      - name: Doxygen warnings
        if: always()
        run: |
          if [ -s docs/_build/doxygen/warnings.log ]; then
            cat docs/_build/doxygen/warnings.log
            echo "::warning::Doxygen reported warnings (see log above)"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
